<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta name="screen-orientation" content="landscape">
<title>Kota Nusantara</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;600;700;800&display=swap" rel="stylesheet">
<style>
/* VOICE: hangat, ramai, kampung yang tumbuh jadi kota — game santai
   IDEA: papan permainan kota di pulau tropis, dilihat dari sudut diagonalQ
   PICTURE: kota isometrik 3D memenuhi layar; UI seperti papan kayu & kertas
   COLOUR and TYPE: terakota, kunyit, kayu jati, putih kapur; Baloo 2
   LAYOUT: HUD atas, bilah alat bawah, panel geser, lanskap */
:root{--ink:#2a1a10;--ink2:#6b5444;--paper:#fffaf3;--paper2:#f3e6d2;--terra:#c4512b;--terra2:#9e3a1c;--kunyit:#f2b134;--daun:#3f8a3a;--biru:#2f6db5;--merah:#c8352b;--line:rgba(42,26,16,.14);--sh:0 4px 16px rgba(30,15,5,.28)}
*{box-sizing:border-box;min-width:0}
html,body{margin:0;height:100%;overflow:hidden;background:#8fd0f2;font-family:'Baloo 2',system-ui,sans-serif;color:var(--ink);-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent;overscroll-behavior:none}
#c{position:fixed;inset:0;width:100vw;height:100vh;height:100dvh;display:block;touch-action:none;outline:none}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible{outline:3px solid var(--kunyit);outline-offset:2px}
.hide{display:none!important}
.card{background:var(--paper);border-radius:14px;box-shadow:var(--sh)}
#top{position:fixed;top:max(8px,env(safe-area-inset-top));left:max(8px,env(safe-area-inset-left));right:max(8px,env(safe-area-inset-right));display:flex;gap:8px;align-items:flex-start;pointer-events:none;z-index:5}
#top>*{pointer-events:auto}
.city{display:flex;gap:8px;align-items:center;padding:5px 12px 5px 5px;min-width:170px}
.lvl{width:38px;height:38px;border-radius:50%;background:var(--terra);color:#fff;font-weight:800;font-size:18px;display:grid;place-items:center;flex:none;box-shadow:inset 0 -3px 0 rgba(0,0,0,.2)}
.cname{font-weight:800;font-size:15px;line-height:1.1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:160px}
.ctitle{font-size:12px;color:var(--ink2);line-height:1.2;white-space:nowrap}
.xpbar{height:5px;background:var(--paper2);border-radius:4px;margin-top:3px;overflow:hidden}
.xpbar i{display:block;height:100%;background:var(--kunyit);width:0;transition:width .3s}
.chips{display:flex;gap:6px;flex-wrap:wrap;flex:1;justify-content:center}
.chip{background:var(--paper);border-radius:999px;padding:3px 12px 3px 3px;display:flex;align-items:center;gap:6px;box-shadow:var(--sh);height:36px;font-weight:700;font-size:16px;white-space:nowrap}
.chip small{font-size:12px;color:var(--ink2);font-weight:600}
.ic{width:30px;height:30px;border-radius:50%;display:grid;place-items:center;flex:none;color:#fff;font-weight:800;font-size:12px}
.ic svg{width:18px;height:18px}
.ic.rp{background:#2fa84f;color:#fff;box-shadow:inset 0 -2px 0 rgba(0,0,0,.18)}.ic.en{background:#f28c1e}.ic.en svg{fill:#fff;stroke:#fff}.ic.gold{background:#b8860b}.ic.pop{background:var(--biru)}.ic.hap{background:var(--daun)}
.ic.hap.mid{background:#d99a1e}.ic.hap.low{background:var(--merah)}
.neg{color:var(--merah)}
.clock{display:flex;align-items:center;gap:8px;padding:4px 6px 4px 12px}
.clock b{display:block;font-size:14px;line-height:1.1;white-space:nowrap}
.clock small{display:block;font-size:11px;color:var(--ink2);line-height:1.2;white-space:nowrap}
.spd{display:flex;background:var(--paper2);border-radius:10px;padding:2px}
.spd button{border:0;background:none;width:34px;height:32px;border-radius:8px;font-weight:800;font-size:13px}
.spd button.on{background:var(--terra);color:#fff}
#dn button{width:auto;padding:0 12px}
#clock{display:none}
#camPad{position:fixed;left:max(8px,env(safe-area-inset-left));bottom:calc(max(8px,env(safe-area-inset-bottom)) + 72px);display:grid;grid-template-columns:repeat(3,34px);grid-template-rows:repeat(3,34px);gap:2px;padding:4px;z-index:5}
#camPad button{border:0;border-radius:9px;background:var(--paper2);display:grid;place-items:center;padding:0}
#camPad button svg{width:18px;height:18px}
#camPad button.on{background:var(--terra);color:#fff}
#camPad .mid{background:none;font-size:10px;font-weight:800;line-height:1;color:var(--ink2);text-align:center}
@media (max-height:430px){#camPad{bottom:calc(max(6px,env(safe-area-inset-bottom)) + 62px);grid-template-columns:repeat(3,30px);grid-template-rows:repeat(3,30px)}}
.bolt{display:inline-block;width:14px;height:14px;vertical-align:-2px;fill:#f28c1e;stroke:#f28c1e}
.flt .bolt{width:18px;height:18px;fill:#ffb347;stroke:#ffb347}
#visit{position:fixed;left:50%;transform:translateX(-50%);bottom:max(8px,env(safe-area-inset-bottom));display:flex;align-items:center;gap:12px;padding:8px 8px 8px 16px;z-index:6;max-width:calc(100vw - 16px)}
#visit b{font-size:15px;line-height:1.2}#visit small{display:block;color:var(--ink2);font-size:12px}
.days{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:6px;margin:8px 0 12px}
.day{border-radius:12px;background:var(--paper2);padding:10px 4px;text-align:center;font-weight:700;font-size:13px;line-height:1.2}
.day svg{width:26px;height:26px;fill:#f28c1e;stroke:#f28c1e;display:block;margin:4px auto}
.day.on{background:#f28c1e;color:#fff}.day.on svg{fill:#fff;stroke:#fff}.day.done{opacity:.5}
.olbox{background:#f3f7ff;border:1px solid #cfe0ff;border-radius:12px;padding:10px 12px;margin-bottom:6px}.olb{font-size:12px;font-weight:800;color:#8a8f98}.olb.on{color:#1f9d4c}.code{font-family:ui-monospace,monospace;font-weight:800;font-size:16px;background:#fff;border:1px dashed #8aa;border-radius:8px;padding:3px 8px;letter-spacing:.06em}#frcode{flex:1;min-width:0;padding:8px 10px;border:1px solid #ccd;border-radius:10px;font:inherit;text-transform:uppercase}#visitActs.hide{display:none!important}
.fr{display:flex;gap:10px;align-items:center;padding:9px 0;border-bottom:1px dashed var(--line)}
.fr .av{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;font-weight:800;color:#fff;flex:none}
.fr .t{flex:1}.fr .t b{display:block;font-size:15px;line-height:1.2}.fr .t small{font-size:12.5px;color:var(--ink2)}
.chip small.et{color:#c0650a;font-weight:700}
#bar{position:fixed;bottom:max(8px,env(safe-area-inset-bottom));left:50%;transform:translateX(-50%);display:flex;gap:2px;padding:5px;z-index:5;max-width:calc(100vw - 16px);overflow-x:auto;scrollbar-width:none}
.tb{position:relative;border:0;background:none;width:58px;height:54px;border-radius:11px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;font-weight:700;font-size:11.5px;line-height:1;flex:none}
.tb svg{width:24px;height:24px}
.tb:hover{background:var(--paper2)}
.tb.on{background:var(--terra);color:#fff}
.badge{position:absolute;top:3px;right:6px;min-width:18px;height:18px;border-radius:9px;background:var(--merah);color:#fff;font-size:11px;font-weight:800;display:grid;place-items:center;padding:0 4px}
#ctx{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(max(8px,env(safe-area-inset-bottom)) + 72px);display:flex;align-items:center;gap:6px;padding:6px 6px 6px 14px;z-index:6;max-width:calc(100vw - 16px)}
#ctxt{font-weight:600;font-size:14px;line-height:1.2;max-width:340px}
#ctxt .bad{color:var(--merah)}
.btn{border:0;border-radius:11px;background:var(--terra);color:#fff;font-weight:700;font-size:15px;min-height:44px;padding:0 16px;display:inline-flex;align-items:center;gap:6px;justify-content:center;white-space:nowrap}
.btn svg{width:18px;height:18px}
.btn.ghost{background:var(--paper2);color:var(--ink)}
.btn.green{background:var(--daun)}
.btn.gold{background:#b8860b}
.btn:disabled{opacity:.45;cursor:default}
.btn.sm{min-height:36px;font-size:13px;padding:0 12px;border-radius:9px}
#info{position:fixed;right:max(8px,env(safe-area-inset-right));top:64px;width:260px;max-height:calc(100dvh - 150px);overflow:auto;padding:12px;z-index:5}
#info h3{margin:0;font-size:18px;line-height:1.15}
#info .sub{font-size:12.5px;color:var(--ink2);margin:2px 0 8px}
.kv{display:flex;justify-content:space-between;gap:8px;font-size:14px;padding:3px 0;border-bottom:1px dashed var(--line)}
.kv span:last-child{font-weight:700;text-align:right;white-space:nowrap}
.prog{height:8px;border-radius:5px;background:var(--paper2);overflow:hidden;margin:6px 0}
.prog i{display:block;height:100%;background:var(--kunyit)}
.needs{display:flex;flex-wrap:wrap;gap:4px;margin:8px 0}
.need{font-size:12px;border-radius:999px;padding:1px 8px;background:#f6d9d2;color:#8a2b1c;font-weight:600}
.need.ok{background:#dcefd6;color:#2c6b28}
.warnbox{background:#fde7e2;color:#8a2b1c;border-radius:10px;padding:6px 9px;font-size:13px;font-weight:600;margin:6px 0}
.acts{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.acts .btn{flex:1 1 auto}
#tut{position:fixed;left:max(8px,env(safe-area-inset-left));top:64px;width:240px;padding:10px 12px;z-index:4;border-left:5px solid var(--kunyit)}
#tut .h{font-size:12px;font-weight:700;color:var(--terra2)}
#tut p{margin:2px 0 6px;font-size:14px;line-height:1.3;font-weight:600}
#tut .r{display:flex;justify-content:space-between;align-items:center;font-size:12px;color:var(--ink2)}
#tut .r span{white-space:nowrap}
#tut button{border:0;background:none;color:var(--ink2);text-decoration:underline;font-size:12px;min-height:30px}
#toasts{position:fixed;top:60px;left:50%;transform:translateX(-50%);display:flex;flex-direction:column;align-items:center;gap:6px;z-index:20;pointer-events:none;width:min(440px,90vw)}
.toast{background:var(--ink);color:#fff;border-radius:12px;padding:7px 14px;font-weight:600;font-size:14px;box-shadow:var(--sh);animation:tin .25s ease-out;text-align:center;line-height:1.3}
.toast.good{background:#2c6b28}.toast.bad{background:var(--merah)}.toast.gold{background:#8a6508}
@keyframes tin{from{opacity:0;transform:translateY(-8px)}}
#fl{position:fixed;inset:0;pointer-events:none;z-index:8;overflow:hidden}
.flt{position:absolute;font-weight:800;font-size:17px;color:#fff;text-shadow:0 2px 0 rgba(0,0,0,.45),0 0 6px rgba(0,0,0,.35);animation:fup 1.3s ease-out forwards;white-space:nowrap;transform:translate(-50%,-50%)}
@keyframes fup{to{opacity:0;margin-top:-46px}}
#collectAll{position:fixed;right:max(8px,env(safe-area-inset-right));bottom:calc(max(8px,env(safe-area-inset-bottom)) + 72px);z-index:5;background:var(--kunyit);color:#4a2f05;box-shadow:var(--sh)}
#shop{position:fixed;left:50%;transform:translateX(-50%);bottom:max(8px,env(safe-area-inset-bottom));width:min(980px,calc(100vw - 16px));z-index:7;padding:8px 8px 10px}
.shead{display:flex;align-items:center;gap:6px;margin-bottom:6px}
.tabs{display:flex;gap:4px;overflow-x:auto;flex:1;scrollbar-width:none}
.tab{border:0;background:var(--paper2);border-radius:10px;padding:0 14px;min-height:38px;font-weight:700;font-size:14px;white-space:nowrap;flex:none}
.tab.on{background:var(--terra);color:#fff}
.x{border:0;background:var(--paper2);width:40px;height:40px;border-radius:10px;font-size:22px;line-height:1;flex:none}
.items{display:flex;gap:8px;overflow-x:auto;padding:2px 2px 4px;scroll-snap-type:x proximity}
.item{flex:none;width:136px;border:2px solid transparent;background:#fff;border-radius:12px;padding:5px;text-align:left;display:flex;flex-direction:column;gap:1px;box-shadow:0 1px 0 var(--line);scroll-snap-align:start}
.item:hover{border-color:var(--kunyit)}
.item img,.item .ph{width:100%;height:84px;object-fit:contain;background:linear-gradient(#e8f4fa,#d7ebd0);border-radius:8px;display:block}
.item b{font-size:13.5px;line-height:1.15;margin-top:3px}
.item .meta{font-size:11.5px;color:var(--ink2);line-height:1.2}
.item .price{font-weight:800;font-size:13px;color:var(--terra2)}
.item.lock{opacity:.55;filter:grayscale(.7)}
.item.lock .price{color:var(--ink2)}
.item.poor .price{color:var(--merah)}
#modal,#dlg{position:fixed;inset:0;background:rgba(30,18,8,.45);display:grid;place-items:center;z-index:30;padding:12px}
.panel{background:var(--paper);border-radius:16px;box-shadow:var(--sh);width:min(620px,100%);max-height:calc(100dvh - 24px);display:flex;flex-direction:column;overflow:hidden}
.panel header{display:flex;align-items:center;gap:8px;padding:10px 10px 6px 16px}
.panel h2{margin:0;font-size:22px;flex:1;line-height:1.1}
#mb{overflow:auto;padding:4px 16px 16px}
.panel.sm{width:min(400px,100%);padding:16px}
.panel.sm h3{margin:0 0 4px;font-size:20px}
.panel.sm p{margin:0 0 14px;font-size:15px;line-height:1.4;color:var(--ink2)}
.row{display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap}
.mis{display:flex;gap:10px;align-items:center;padding:9px 0;border-bottom:1px dashed var(--line)}
.mis .t{flex:1}
.mis .t b{display:block;font-size:15px;line-height:1.2}
.mis .t small{font-size:12.5px;color:var(--ink2)}
.mis.done .t b{color:var(--daun)}
.mis.claimed{opacity:.5}
.story{background:#fff8e6;border:2px solid #f2c94c;border-radius:14px;padding:10px 12px;margin:4px 0}.story.ok{border-color:#3fbf4a;background:#effbe9}.story .who{font-size:12px;font-weight:700;color:#b06a00;text-transform:uppercase;letter-spacing:.04em}.story b{display:block;font-size:17px;margin:2px 0}.story p{margin:4px 0 6px;font-size:13.5px;line-height:1.35;font-style:italic}.story .goal{font-weight:700;font-size:14px;margin-bottom:4px}.story .rw{font-size:12.5px;color:var(--ink2);margin:6px 0}.story .btn{width:100%}
.sec{font-weight:800;font-size:15px;margin:12px 0 4px;color:var(--terra2)}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:4px 18px}
.bar2{display:grid;grid-template-columns:90px minmax(0,1fr) 42px;gap:8px;align-items:center;font-size:13.5px;margin:3px 0}
.bar2 .prog{margin:0}
.bar2 span:last-child{text-align:right;font-weight:700}
input[type=range]{width:100%;accent-color:var(--terra);height:30px}
input[type=text],textarea{width:100%;font:16px 'Baloo 2',sans-serif;border:2px solid var(--line);border-radius:10px;padding:6px 10px;background:#fff;color:var(--ink);-webkit-user-select:text;user-select:text}
textarea{height:80px;font-size:12px;font-family:ui-monospace,monospace;resize:vertical}
.note{font-size:12.5px;color:var(--ink2);line-height:1.35}
.help{font-size:14px;line-height:1.45;margin:4px 0;padding-left:18px}
#load{position:fixed;inset:0;background:linear-gradient(#f2a46e,#c4512b);display:grid;place-items:center;z-index:50;color:#fff;text-align:center;padding:20px}
#load .lt{font-size:clamp(34px,7vw,56px);font-weight:800;line-height:1.05;text-shadow:0 3px 0 rgba(0,0,0,.2)}
#load .ls{font-size:17px;font-weight:600;opacity:.9;margin-top:6px}
#rot{position:fixed;inset:0;background:var(--terra);color:#fff;z-index:60;display:none;flex-direction:column;align-items:center;justify-content:center;gap:16px;text-align:center;padding:24px;font-size:18px;font-weight:700}

@keyframes rr{50%{transform:rotate(-90deg)}}
@media (orientation:portrait) and (max-width:820px){body:not(.porto) #rot{display:flex}}
@media (max-height:430px){
 .city{min-width:0;padding-right:10px}.cname{max-width:110px;font-size:14px}.lvl{width:32px;height:32px;font-size:15px}
 .chip{height:32px;font-size:14px}.ic{width:26px;height:26px}
 .tb{width:52px;height:48px;font-size:10.5px}.tb svg{width:21px;height:21px}
 #ctx{bottom:calc(max(6px,env(safe-area-inset-bottom)) + 62px)}
 #collectAll{bottom:calc(max(6px,env(safe-area-inset-bottom)) + 62px)}

}
@media (max-width:1100px){.chip{height:32px;font-size:14px;padding:2px 9px 2px 2px;gap:4px}.chips{gap:4px;flex-wrap:nowrap}.ic{width:26px;height:26px}.ic svg{width:16px;height:16px}.clock small{display:none}.clock{padding:3px 4px 3px 10px}.city{min-width:0;padding-right:10px}.cname{max-width:120px}#dn button{padding:0 9px}}
@media (max-width:800px){.chip small{display:none}.chip small.et{display:inline}.ctitle{display:none}.cname{max-width:90px}#top{gap:4px}.chips{justify-content:flex-start}}
.avi{background:#fff url(assets/avatar.webp) no-repeat;background-size:600% 500%;box-shadow:0 0 0 2px #fff,0 1px 3px rgba(0,0,0,.25)}
.cav{width:38px;height:38px;border-radius:50%;flex:none;cursor:pointer}
.tag{display:inline-block;font-size:10px;font-weight:800;background:#c0392b;color:#fff;border-radius:6px;padding:0 5px;vertical-align:middle;line-height:16px}.tag.new{background:#1f9d4c}
.fr.adm{background:#fff7e8;border-radius:12px;padding:9px 8px;border:1px solid #f2d39a}

.msg.me{flex-direction:row-reverse}.msg.me .bub{background:#e3f4e6;border-radius:12px 12px 4px 12px}
#chatIn{flex:1;min-width:0;padding:9px 10px;border:1px solid #ccd;border-radius:10px;font:inherit}

 #top{flex-wrap:nowrap}

async function sha256hex(s){const h=await crypto.subtle.digest('SHA-256',new TextEncoder().encode(s));return[...new Uint8Array(h)].map(x=>x.toString(16).padStart(2,'0')).join('');}
